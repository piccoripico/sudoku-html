name: Localized screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-readme-and-english-store-screenshots
          path: |
            docs/READMEs/screenshots/screenshot_*.jpeg
            docs/store-assets/screenshots/*.png
            docs/store-assets/sources/*.jpeg
            docs/store-assets/sources/*.json
