<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数独 (Sudoku)</title>
  <script src="./theme-init.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <header class="hero">
      <h1 id="title" aria-label="数独 (Sudoku)">
        <span class="brand-lockup">
          <img class="brand-icon" src="./icons/icon128.png" width="52" height="52" alt="" aria-hidden="true" />
          <span class="brand-type">
            <span class="brand-wordmark">Sudoku</span>
            <span class="brand-caption"><span class="brand-rule" aria-hidden="true"></span><span lang="ja">数独</span><span class="brand-rule" aria-hidden="true"></span></span>
          </span>
        </span>
      </h1>
      <div class="utility-actions">
        <div class="utility-buttons">
          <button class="ghost" id="saveGame" type="button">状態を保存</button>
          <button class="ghost" id="loadGame" type="button">保存を読込</button>
          <button class="ghost" id="highlightSettings" type="button" aria-haspopup="dialog" aria-controls="highlightSettingsOverlay" aria-expanded="false">設定</button>
          <button class="ghost" id="help" type="button" aria-haspopup="dialog" aria-controls="helpOverlay" aria-expanded="false">ヘルプ</button>
        </div>
        <div class="timer" id="timer" aria-live="polite">--:--</div>
        <input id="loadFile" type="file" accept=".json,application/json" hidden />
      </div>
    </header>

    <div class="top-bar">
      <div class="settings-grid">
        <div class="field">
          <label id="clueCountLabel" for="clueCount">ヒント数</label>
          <select id="clueCount">
            <option value="17">17 (最難関)</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="24">24 (かなり難しい)</option>
            <option value="26">26</option>
            <option value="28">28 (難しめ)</option>
            <option value="30">30</option>
            <option value="32" selected>32 (標準)</option>
            <option value="34">34</option>
            <option value="36">36</option>
            <option value="38">38 (易しめ)</option>
            <option value="40">40</option>
            <option value="42">42</option>
            <option value="44">44 (かなり易しい)</option>
            <option value="46">46</option>
            <option value="48">48</option>
          </select>
        </div>

        <div class="field" id="seedField">
          <label id="seedLabel" for="seed">シード（空白でランダム）</label>
          <input id="seed" type="number" placeholder="オプション（空白でランダム）" />
        </div>

        <div class="field">
          <label id="langLabel" for="lang">Language</label>
          <select id="lang">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="hi">हिन्दी</option>
            <option value="es">Español</option>
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="pt-PT">Português (Portugal)</option>
            <option value="ru">Русский</option>
            <option value="de">Deutsch</option>
            <option value="id">Bahasa Indonesia</option>
            <option value="bn">বাংলা</option>
            <option value="tr">Türkçe</option>
            <option value="ko">한국어</option>
            <option value="vi">Tiếng Việt</option>
            <option value="it">Italiano</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
            <option value="th">ไทย</option>
            <option value="ur">اردو</option>
            <option value="fa">فارسی</option>
            <option value="sw">Kiswahili</option>
            <option value="zh-TW">繁體中文</option>
            <option value="uk">Українська</option>
          </select>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label id="themeLabel" for="theme">表示</label>
            <label class="preference-save-toggle" id="preferenceSaveToggle" title="ヒント数、シード、言語、表示をこのブラウザに保存">
              <input id="persistPreferences" type="checkbox" />
              <span id="preferenceSaveLabel">設定保存</span>
            </label>
          </div>
          <select id="theme">
            <option value="system">システム設定</option>
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </div>
      </div>

      <div class="action-row primary-actions">
        <button class="primary" id="newGame" type="button">新しい盤面を作成</button>
        <button class="ghost" id="reset" type="button">最初の状態に戻す</button>
        <button class="ghost" id="hint" type="button">ヒントを埋める</button>
        <button class="ghost" id="solve" type="button">答えを表示</button>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board" aria-label="Sudoku board"></div>
      <div class="sidebar">
        <section class="panel" aria-labelledby="padTitle">
          <div class="panel-header">
            <h2 id="padTitle">数字パッド</h2>
            <button class="pad-clear" id="clearPad" type="button">クリア</button>
          </div>
          <div class="pad" id="pad"></div>
          <div class="pad-modes" id="padModes"></div>
          <div class="controls">
            <button class="ghost" id="undo">↩️ １つ戻す</button>
            <button class="ghost" id="redo">↪️ １つ進める</button>
          </div>
          <ul class="pad-help-list" id="hintText"></ul>
        </section>

        <section class="message-panel" aria-live="polite">
          <ul class="stats-list" id="stats"></ul>
          <div class="status" id="status"></div>
        </section>
      </div>
    </div>

    <div class="help-overlay" id="highlightSettingsOverlay" hidden>
      <section class="settings-dialog" id="highlightSettingsDialog" role="dialog" aria-modal="true" aria-labelledby="highlightSettingsTitle">
        <div class="help-header">
          <h2 id="highlightSettingsTitle">ハイライト設定</h2>
          <button class="ghost" id="highlightSettingsClose" type="button">閉じる</button>
        </div>
        <div class="settings-dialog-content">
          <label class="toggle-option" id="highlightCompletedToggleLabel">
            <input id="highlightCompletedToggle" type="checkbox" />
            <span id="highlightCompletedToggleText">そろった数字をハイライト</span>
          </label>
          <label class="toggle-option" id="highlightDuplicateToggleLabel">
            <input id="highlightDuplicateToggle" type="checkbox" />
            <span id="highlightDuplicateToggleText">重複した数字をハイライト</span>
          </label>
        </div>
      </section>
    </div>

    <div class="help-overlay" id="helpOverlay" hidden>
      <section class="help-dialog" id="helpDialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <div class="help-header">
          <h2 id="helpTitle">ゲームの使い方</h2>
          <button class="ghost" id="helpClose" type="button">閉じる</button>
        </div>
        <div class="help-content" id="helpContent"></div>
      </section>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
  <script type="module" src="./theme.js"></script>
</body>
</html>
